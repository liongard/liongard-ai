"$schema": "../../schemas/primitive.schema.json"

primitives:

  - "@id": "metrics:dropbox:users-total-count"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Total User Count"
    description: "Total number of users in the Dropbox Business tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members)"
    resultType: "integer"
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:dropbox:users-active-count"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Active User Count"
    description: "Number of active users in the Dropbox Business tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members[?Profile.Status.Tag=='active'])"
    resultType: "integer"
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:dropbox:users-suspended-count"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Suspended User Count"
    description: "Number of suspended users in the Dropbox Business tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members[?Profile.Status.Tag=='suspended'])"
    resultType: "integer"
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"









  - "@id": "metrics:dropbox:team-folders-total-count"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Team Folder Count"
    description: "Total number of team folders in the Dropbox Business tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Namespaces[?namespace_type.\".tag\"=='team_folder'])"
    resultType: "integer"
    fieldGotcha: "The key is literally \".tag\" and needs double-quoted identifier syntax."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"


  - "@id": "metrics:dropbox:licensing-seat-total"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Licensed Seat Total"
    description: "Total number of licensed seats in the Dropbox subscription."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "SystemInfo.Result.NumLicensedUsers"
    resultType: "integer"
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:dropbox:licensing-seat-used"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Licensed Seat Used"
    description: "Number of licensed seats currently in use."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "SystemInfo.Result.NumUsedLicenses"
    resultType: "integer"
    fieldGotcha: "NumProvisionedUsers also exists."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"


  - "@id": "metrics:dropbox:security-admin-count"
    "@type": "liongard:MetricPrimitive"
    name: "Dropbox — Admin User Count"
    description: "Number of users with admin roles in the Dropbox tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "dropbox-inspector"
      inspectorId: 34
    compliesWith:
      - "CIS-Controls-v8:5.4"
    sourceRecipe: "recipes/single-system-analysis/by-inspector/dropbox.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members[?Role.Tag!='member_only'])"
    resultType: "integer"
    fieldGotcha: "Roles observed: team_admin, member_only."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

