"$schema": "../../schemas/primitive.schema.json"

primitives:

  - "@id": "metrics:box:system-info"
    "@type": "liongard:MetricPrimitive"
    name: "Box — System Info"
    description: "Top-level system information object for the Box enterprise tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    liongardMetricName: "Box: SystemInfo"
    liongardMetricId: 438
    liongardMetricUuid: "5611c39c-1d87-4907-a6df-1b8dc0953c73"
    jmesPath: "SystemInfo"
    resultType: "object"
    status: "VALIDATED"
    validatedOn: "2026-05-26"
    validatedSystemReference: "Liongard Global metric catalog"
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"

  - "@id": "metrics:box:users-total-count"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Total User Count"
    description: "Total number of users in the Box enterprise tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members)"
    resultType: "integer"
    fieldGotcha: "Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:box:users-active-count"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Active User Count"
    description: "Number of active users in the Box enterprise tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members[?Status=='active'])"
    resultType: "integer"
    fieldGotcha: "Members[].Status is lowercase \"active\". Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:box:users-inactive-count"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Inactive User Count"
    description: "Number of inactive users in the Box enterprise tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members[?Status!='active'])"
    resultType: "integer"
    fieldGotcha: "Non-active status values not yet observed. Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"


  - "@id": "metrics:box:users-mfa-enabled-count"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Two-Factor Required (tenant policy)"
    description: "Number of Box users with MFA enabled."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    compliantWhen: "== total users"
    compliesWith:
      - "CIS-Controls-v8:6.3"
      - "CIS-Controls-v8:6.5"
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "SecuritySettings.TwoFactorRequired"
    resultType: "boolean"
    fieldGotcha: "Tenant-wide 2FA-required flag; Box exposes no per-user MFA field. Result is a boolean, not a count. Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:box:storage-total-gb"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Storage Quota Total (bytes)"
    description: "Total storage capacity allocated to the Box enterprise tenant in GB."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "sum(Members[*].SpaceAmount)"
    resultType: "integer"
    fieldGotcha: "Sum of per-user quotas in BYTES (no GB conversion in JMESPath). Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

  - "@id": "metrics:box:storage-used-gb"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Storage Used (bytes)"
    description: "Storage currently used by the Box enterprise tenant in GB."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "sum(Members[*].SpaceUsed)"
    resultType: "integer"
    fieldGotcha: "Sum of per-user usage in BYTES. Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"






  - "@id": "metrics:box:retention-policies-count"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Retention Policies Count"
    description: "Number of active retention policies configured in the Box tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    compliantWhen: ">= 1"
    compliesWith:
      - "CIS-Controls-v8:3.12"
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(RetentionPolicies)"
    resultType: "integer"
    fieldGotcha: "Exists only in the Users/Files layout; empty on all test systems. length() errors when the key is absent."
    status: "SCHEMA_CONFIRMED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"




  - "@id": "metrics:box:security-admin-count"
    "@type": "liongard:MetricPrimitive"
    name: "Box — Admin User Count"
    description: "Number of users with Admin or Co-Admin roles in the Box tenant."
    evaluates:
      "@type": "liongard:Inspector"
      inspectorSlug: "box-com-inspector"
      inspectorId: 14
    compliesWith:
      - "CIS-Controls-v8:5.4"
    sourceRecipe: "recipes/single-system-analysis/by-inspector/box.md"
    dateAdded: "2026-05-26"
    jmesPath: "length(Members[?Role=='admin' || Role=='coadmin'])"
    resultType: "integer"
    fieldGotcha: "Roles observed: admin, coadmin, user. Box dataprints come in two layouts (Members/Enterprise/SecuritySettings vs Users/Files/RetentionPolicies); this path exists only in the first."
    status: "VALIDATED"
    validatedOn: "2026-10-07"
    validatedSystemReference: "Systems A, B (dev environment), live EVALUATE 2026-10-07"

